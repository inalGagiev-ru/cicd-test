<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Deployed! 🚀</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a1a;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Анимированный фон из частиц */
        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 700px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            background: linear-gradient(135deg, #00f5d4, #7b2ff7, #f72585);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 1rem;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2.5rem;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.6s both;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(123,47,247,0.3);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .dot {
            width: 12px; height: 12px;
            background: #00f5d4;
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #7b2ff7, #f72585);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 1s ease 0.9s both;
            text-decoration: none;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 4px 24px rgba(247,37,133,0.5); }
        .btn:active { transform: scale(0.97); }

        .counter { font-size: 3rem; font-weight: 800; margin: 1rem 0; font-variant-numeric: tabular-nums; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            position: relative; z-index: 1;
            margin-top: 2rem; opacity: 0.5; font-size: 0.85rem;
            animation: fadeInUp 1s ease 1.2s both;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <h1>ТЕСТ    CI        CD</h1>
    <div class="container">
        <h1>🚀 Успешно задеплоено!</h1>
        <p class="subtitle">Твой первый CI/CD пайплайн работает</p>

        <div class="card">
            <div class="status"><span class="dot"></span> Сервер жив и отвечает</div>
            <div class="counter" id="counter">0</div>
            <p style="opacity:0.7">нажатий на кнопку</p>
        </div>

        <button class="btn" id="clickBtn">Нажми меня ✨</button>

        <div class="footer">
            Деплой через SSH • GitHub Actions • Nginx<br>
            Сделано с 💜 для первого CI/CD
        </div>
    </div>

    <script>
        // === Частицы на фоне ===
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.color = ['#00f5d4','#7b2ff7','#f72585'][Math.floor(Math.random()*3)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // === Счётчик кликов ===
        let count = parseInt(localStorage.getItem('cicd_clicks') || '0');
        const counterEl = document.getElementById('counter');
        const btn = document.getElementById('clickBtn');
        counterEl.textContent = count;

        btn.addEventListener('click', () => {
            count++;
            counterEl.textContent = count;
            localStorage.setItem('cicd_clicks', count);

            // Мини-анимация при клике
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = '', 150);

            // Конфетти-вспышка (упрощённая)
            for (let i = 0; i < 5; i++) {
                const p = new Particle();
                p.x = canvas.width / 2;
                p.y = canvas.height / 2;
                p.vx = (Math.random() - 0.5) * 8;
                p.vy = (Math.random() - 0.5) * 8;
                p.size = Math.random() * 4 + 2;
                p.alpha = 1;
                particles.push(p);
            }
        });
    </script>
</body>
</html>
